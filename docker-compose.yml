version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: suvida-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - suvida-network

  redis:
    image: redis:7-alpine
    container_name: suvida-redis
    ports:
      - "6379:6379"
    networks:
      - suvida-network

  service-registry:
    build:
      context: ./service-registry
      dockerfile: Dockerfile
    container_name: suvida-service-registry
    ports:
      - "8761:8761"
    networks:
      - suvida-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: suvida-api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      - service-registry
    networks:
      - suvida-network

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: suvida-user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/suvida_users
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      - postgres
      - service-registry
    networks:
      - suvida-network

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: suvida-product-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/suvida_products
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      - postgres
      - service-registry
    networks:
      - suvida-network

  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    container_name: suvida-cart-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/suvida_cart
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      - postgres
      - service-registry
    networks:
      - suvida-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: suvida-order-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/suvida_orders
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      - postgres
      - service-registry
    networks:
      - suvida-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: suvida-payment-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/suvida_payments
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      - postgres
      - service-registry
    networks:
      - suvida-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: suvida-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api-gateway
    networks:
      - suvida-network

networks:
  suvida-network:
    driver: bridge

volumes:
  postgres_data:

