server.port=8082
spring.application.name=product-service

# Database Configuration
# Local UI testing uses an embedded H2 database (file-based, data persists across restarts).
# In Docker the SPRING_DATASOURCE_URL env var overrides this to point at PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/suvida_products
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# H2 web console: http://localhost:8082/h2-console (JDBC URL: jdbc:h2:file:./data/suvida_products)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

