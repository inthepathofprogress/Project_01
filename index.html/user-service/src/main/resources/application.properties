server.port=8081
spring.application.name=user-service

# Database Configuration
# Local UI testing uses an embedded H2 database (file-based, data persists across restarts).
# In Docker the SPRING_DATASOURCE_URL env var overrides this to point at PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/suvida_users
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# H2 web console: http://localhost:8081/h2-console (JDBC URL: jdbc:h2:file:./data/suvida_users)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# JWT Configuration
jwt.secret=suvida-ecommerce-secret-key-for-jwt-token-generation-2024
jwt.expiration=86400000

